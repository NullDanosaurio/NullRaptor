# Construye la imagen en GitHub, la arranca de verdad en Linux y, solo si todo pasa, la publica en
# GitHub Container Registry (ghcr.io/<cuenta>/nullraptor) al subir a main, crear una etiqueta v* o lanzarlo a mano.
name: imagen
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  publicar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - name: Pruebas unitarias
        run: npm ci --ignore-scripts && npm test

      - name: Construir la imagen
        run: docker build -t agente:prueba . && docker image ls agente:prueba

      - name: Arrancar el contenedor dos veces (memoria, MCP de Ruflo y persistencia)
        run: |
          set -euo pipefail
          # Memoria mínima de prueba, servida desde un repositorio local montado en solo lectura.
          mem=$(mktemp -d)
          mkdir -p "$mem/Proyectos"
          printf -- '---\ntipo: proyecto\n---\n# Prueba\n' > "$mem/Proyectos/Prueba.md"
          git -C "$mem" init -q -b main
          git -C "$mem" add .
          git -C "$mem" -c user.name=ci -c user.email=ci@local commit -qm base
          git clone -q --bare "$mem" /tmp/memoria.git
          sudo chown -R 1000:1000 /tmp/memoria.git   # usuario node del contenedor: evita «dubious ownership»
          arrancar() { docker run --rm -v agente-prueba:/estado -v /tmp/memoria.git:/memoria.git:ro -e MEMORIA_REPO=/memoria.git agente:prueba; }
          arrancar | tee primero.json
          arrancar | tee segundo.json
          grep -q '"ok": true' segundo.json
          grep -q '"arranques": 2' segundo.json   # la memoria de Ruflo persiste en el volumen

      - name: Diagnóstico de la memoria de Ruflo (solo si algo falla)
        if: failure()
        run: |
          docker run --rm -v agente-prueba:/estado --entrypoint sh agente:prueba -c '
            echo "== CLAUDE_FLOW_MEMORY_PATH=$CLAUDE_FLOW_MEMORY_PATH"
            ls -la /nullraptor/.swarm /nullraptor/.claude-flow /estado/ruflo/swarm /estado/ruflo/policy 2>&1
            echo "== memory.db en el contenedor:"; find / -name "memory.db" -not -path "/proc/*" 2>/dev/null
            echo "== memoria portable:"; node node_modules/ruflo/bin/ruflo.js memory retrieve --key verificacion/arranques --namespace portable 2>&1 | tail -15
            echo "== política:"; node node_modules/ruflo/bin/ruflo.js policy verify 2>&1 | tail -10'

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/nullraptor
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
      - name: Publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
