# Para desarrollar el agente en local: `docker compose run --rm nullraptor` (construye desde este repositorio).
# En cualquier otro equipo basta: docker run -it --rm -v nullraptor:/estado ghcr.io/nulldanosaurio/nullraptor
services:
  nullraptor:
    build: .
    image: nullraptor:dev
    volumes:
      - nullraptor:/estado
    ports:
      - "127.0.0.1:4321:4321"   # panel web: docker compose run --rm --service-ports nullraptor node panel/servidor.mjs
    stdin_open: true
    tty: true

volumes:
  nullraptor:
