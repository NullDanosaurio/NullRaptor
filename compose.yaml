# Para desarrollar el agente en local: `docker compose run --rm agente` (construye desde este repositorio).
# En cualquier otro equipo basta: docker run -it --rm -v agente:/estado ghcr.io/<org>/agente
services:
  agente:
    build: .
    image: ruflo-portable:dev
    volumes:
      - agente:/estado
    stdin_open: true
    tty: true

volumes:
  agente:
